<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>NetflixLight · films et séries, ta watchlist et tes reprises</title>
    <meta
      name="description"
      content="NetflixLight, un mini Netflix : découvre les films et séries tendance, garde ta watchlist, note ce que tu regardes et reprends là où tu t’étais arrêté, avec plusieurs profils."
    />
    <link rel="canonical" href="https://palawi.fr/netflix-light/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NetflixLight" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://palawi.fr/netflix-light/" />
    <meta
      property="og:title"
      content="NetflixLight · films et séries, ta watchlist et tes reprises"
    />
    <meta
      property="og:description"
      content="NetflixLight, un mini Netflix : découvre les films et séries tendance, garde ta watchlist, note ce que tu regardes et reprends là où tu t’étais arrêté, avec plusieurs profils."
    />
    <meta
      property="og:image"
      content="https://palawi.fr/netflix-light/icons/og-image.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- applies the stored language early so the shared consent banner speaks the same language -->
    <script>
      (() => {
        try {
          const storedLanguage = window.localStorage.getItem(
            "netflixlight.language"
          );

          if (storedLanguage === "fr" || storedLanguage === "en") {
            document.documentElement.lang = storedLanguage;
          }
        } catch {
          // storage unavailable: keep the default language
        }
      })();
    </script>
    <!-- shared palawi.fr consent manager: YouTube trailers only load once allowed -->
    <script
      src="/consent/palawi-consent.js"
      data-purposes="video"
      data-providers="YouTube"
    ></script>
    <!-- applies the stored theme before the page renders to avoid a flash of unstyled content -->
    <script>
      (() => {
        const storageKey = "netflixlight.theme";
        const storedTheme = window.localStorage.getItem(storageKey);
        const prefersLight = window.matchMedia(
          "(prefers-color-scheme: light)"
        ).matches;
        const theme =
          storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : prefersLight
              ? "light"
              : "dark";

        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="min-h-screen bg-neutral-950 text-white">
    <div
      data-app-background
      class="min-h-screen overflow-x-hidden bg-[radial-gradient(circle_at_top,_rgba(244,63,94,0.18),_transparent_28%),linear-gradient(180deg,_#09090b,_#171717)]"
    >
      <div id="app"></div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
